topic: practice-situations
title: Практические ситуации
chapter: practice
questions:
  - id: practice-python-shared-list
    type: choice
    context: Для каждого пользователя хотели создать отдельный список задач.
    code: |-
      tasks = [[]] * 3
      tasks[0].append("read")
      print(tasks)
    q: Что выведет Python?
    options:
      - "`[['read'], [], []]`"
      - "`[['read'], ['read'], ['read']]`"
      - "`[[], [], []]`"
      - "Возникнет `IndexError`"
    answer: 1
    explain: Повторение списка копирует ссылки. Все три позиции указывают на один вложенный список. Выражение `[[] for _ in range(3)]` создаёт три разных списка.

  - id: practice-python-zip
    type: choice
    context: Два списка пришли из разных файлов. Их длины не совпали.
    code: |-
      ids = [10, 20, 30]
      names = ["Ana", "Bo"]
      print(dict(zip(ids, names)))
    q: Что увидишь в выводе?
    options:
      - "`{10: 'Ana', 20: 'Bo', 30: None}`"
      - "Обычный `zip` вызовет `ValueError`"
      - "`{10: 'Ana', 20: 'Bo'}`"
      - "`{}`"
    answer: 2
    explain: Обычный `zip` заканчивает на самом коротком входе. Если потеря строки недопустима, используй `zip(ids, names, strict=True)` в Python 3.10+ или заранее проверь длины.

  - id: practice-http-authorization
    type: choice
    context: API отвечает 200 на запрос профиля с действующим токеном. Тот же эндпоинт отвечает 401 на запрос из твоего скрипта.
    q: Что проверить первым?
    options:
      - Правильность заголовка Authorization и срок действия токена
      - Размер тела ответа
      - Порядок полей в ответе JSON
      - Кодировку имени пользователя
    answer: 0
    explain: Статус 401 указывает на отсутствующие или недействительные данные аутентификации. Сравни, как рабочий клиент и скрипт формируют заголовок, и проверь срок действия токена.

  - id: practice-http-post-timeout
    type: choice
    context: Ты отправил POST для создания тестового заказа. Ответ не пришёл до тайм-аута. API принимает ключ идемпотентности.
    q: Как повторить запрос с наименьшим риском создать дубликат?
    options:
      - Повторить тот же запрос с тем же ключом идемпотентности
      - Повторить запрос с новым ключом
      - Повторить запрос дважды с разными ключами
      - Заменить POST на GET и сохранить тело запроса
    answer: 0
    explain: Сервер мог создать заказ до тайм-аута. Тот же ключ позволяет API распознать повтор той же операции. Новый ключ обозначает новую операцию.

  - id: practice-git-staged-diff
    type: choice
    context: Ты добавил `app.py` в индекс командой `git add`, а затем поменял в нём ещё одну строку. Перед коммитом хочешь проверить, что именно попадёт в него.
    q: Какую команду запустить?
    options:
      - "`git diff --staged`"
      - "`git diff`"
      - "`git log -1`"
      - "`git branch`"
    answer: 0
    explain: "`git diff --staged` сравнивает индекс с последним коммитом. Обычный `git diff` покажет последнюю правку рабочей копии, которую ещё не добавили в индекс."

  - id: practice-terminal-stderr
    type: choice
    context: Команда `python report.py > report.txt` сохраняет отчёт, но сообщение об ошибке по-прежнему видно в терминале.
    q: Как сохранить ошибки отдельно от отчёта?
    options:
      - "`python report.py > report.txt 2> errors.txt`"
      - "`python report.py > report.txt > errors.txt`"
      - "`python report.py > report.txt 2>&1`"
      - "`python report.py < errors.txt > report.txt`"
    answer: 0
    explain: "Обычный вывод идёт в stdout, дескриптор 1. Ошибки идут в stderr, дескриптор 2. Связка `2>&1` направила бы оба потока в один файл."

  - id: practice-algo-duplicate-indices
    type: choice
    leetcode: [1]
    context: Вариант со словарём сначала записывает текущий индекс и только потом проверяет, есть ли дополнение до цели.
    code: |-
      nums = [3, 3]
      target = 6
      seen = {}
      for i, x in enumerate(nums):
          seen[x] = i
          if target - x in seen:
              print(seen[target - x], i)
              break
    q: Какие индексы выведет этот код?
    options:
      - "`0 1`"
      - "`1 0`"
      - "`0 0`"
      - Ничего не выведет
    answer: 2
    explain: При i = 0 число 3 уже записано в словарь, так что проверка находит тот же элемент. Сначала ищи дополнение среди предыдущих элементов, затем добавляй текущий.
