topic: http-basics
title: HTTP — запросы, методы, коды
chapter: http
week: 2
questions:
  - {id: http-001, type: choice, q: "Что значит «HTTP без состояния»?", options: ["Сервер не хранит файлы", "Сервер не помнит предыдущих запросов; сессии строят поверх (cookies, токены)", "Протокол не использует TCP", "Запросы нельзя повторять"], answer: 1, explain: "Каждый запрос самодостаточен. Помнить пользователя помогают cookie или заголовок Authorization."}
  - {id: http-002, type: choice, q: "Какая часть URL не отправляется на сервер?", options: ["Путь", "Query после `?`", "Фрагмент после `#`", "Порт"], answer: 2, explain: "Фрагментом пользуется только браузер."}
  - {id: http-003, type: multi, q: "Какие методы идемпотентны? (выбери все верные)", options: ["GET", "PUT", "DELETE", "POST"], answer: [0, 1, 2], explain: "Повтор того же запроса даёт тот же результат. POST при повторе обычно создаёт ещё одну запись."}
  - {id: http-004, type: choice, q: "Чем `401` отличается от `403`?", options: ["Ничем", "401 — не представился (нет или неверные данные), 403 — представился, но доступ запрещён", "401 — ресурса нет, 403 — ошибка сервера", "403 — не авторизован"], answer: 1, explain: "401 про аутентификацию, 403 про права."}
  - {id: http-005, type: choice, q: "Чем `400` отличается от `422`?", options: ["400 — запрос не разобрать, 422 — разобрался, но данные не проходят проверку", "400 — сервер упал, 422 — клиент ошибся", "Это одно и то же", "422 — перенаправление"], answer: 0, explain: "FastAPI отвечает 422 на неверные поля."}
  - {id: http-006, type: choice, q: "Что значит `405`?", options: ["Ресурса нет", "Путь есть, но метод не поддерживается", "Слишком много запросов", "Таймаут шлюза"], answer: 1, explain: "404 — ресурса нет, 429 — слишком много запросов, 504 — таймаут шлюза."}
  - {id: http-007, type: choice, q: "Что делает атрибут cookie `HttpOnly`?", options: ["Отправляет только по HTTPS", "Скрывает cookie от JavaScript (защита от кражи через XSS)", "Ограничивает срок жизни", "Запрещает межсайтовые запросы"], answer: 1, explain: "`Secure` — только HTTPS, `SameSite` — защита от CSRF."}
  - {id: http-008, type: choice, q: "Почему `curl` без `-L` не идёт по редиректу?", options: ["Редиректы запрещены", "По умолчанию curl просто показывает ответ 3xx; за Location идёт только с `-L`", "Нужен `-i`", "Нужен HTTP/2"], answer: 1, explain: "Редирект — ответ 3xx с заголовком Location, клиент сам повторяет запрос."}
  - {id: http-009, type: order, q: "Расставь шаги работы cookie-сессии", items: ["POST /login с логином и паролем", "Сервер отвечает 200 и Set-Cookie: session_id", "Браузер сохраняет cookie", "GET /profile, браузер сам шлёт Cookie", "Сервер по session_id узнаёт пользователя"], explain: "Cookie ставит сервер, а отправляет браузер автоматически при каждом запросе к сайту."}
