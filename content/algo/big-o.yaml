topic: algo-big-o
title: Алгоритмы — Big-O и паттерны хэш-таблиц
chapter: algo
week: 1
questions:
  - {id: algo-001, type: choice, q: "Как складываются сложности циклов?", options: ["Последовательные перемножаются, вложенные складываются", "Последовательные складываются, вложенные перемножаются", "Всегда складываются", "Всегда перемножаются"], answer: 1, explain: "И помни: встроенный метод внутри цикла считается как цикл."}
  - {id: algo-002, leetcode: [349], type: choice, q: "В цикле по n элементам стоит `if x in lst` (lst из n). Итог?", options: ["O(n)", "O(n log n)", "O(n²)", "O(1)"], answer: 2, explain: "`x in list` — O(n). Заменить на `set` — тогда O(n). Именно так в LC 349."}
  - {id: algo-003, leetcode: [217], type: choice, q: "Что такое «лучший случай» при фиксированном n?", options: ["Вход короче", "Вход того же размера, на котором работы меньше (ранний выход)", "Пустой вход", "Любой вход"], answer: 1, explain: "Пример LC 217: `[1, 1, ...]` выход на 2-й итерации, худший — дубликатов нет. Это повторяющаяся ошибка недели 1."}
  - {id: algo-004, type: choice, q: "Если ранних выходов нет, лучший и худший случай…", options: ["Лучший O(1)", "Совпадают", "Лучший O(log n)", "Определить нельзя"], answer: 1, explain: "Так в LC 268, 121, 13."}
  - {id: algo-005, leetcode: [14], type: choice, q: "Почему `startswith` на растущем префиксе в цикле даёт O(n·m²)?", options: ["startswith — O(1)", "startswith сравнивает до len(p) символов: скрытый цикл внутри цикла", "Срезы бесплатны", "Из-за рекурсии"], answer: 1, explain: "LC 14: сравнение «по столбцам» `s[i] == target[i]` даёт O(n·m)."}
  - {id: algo-006, leetcode: [217, 349], type: choice, q: "Какой паттерн у задач «Contains Duplicate» и «Intersection of Two Arrays»?", options: ["Скользящее окно", "«Уже видел»: множество или словарь пройденных значений", "Бинарный поиск", "Два указателя"], answer: 1, explain: "Подсчёт частот — 242, 383, 169; дополнение до цели — LC 1."}
  - {id: algo-007, leetcode: [1], type: choice, q: "Как решается Two Sum за один проход?", options: ["Двумя вложенными циклами", "Словарь «значение → индекс»; для x ищем target − x среди виденных", "Сортировка и бинпоиск", "Префиксные суммы"], answer: 1, explain: "Поиск дополнения за O(1) даёт O(n) вместо O(n²)."}
  - {id: algo-008, leetcode: [169], type: choice, q: "Что сделать с кандидатом Бойера–Мура, если убрать гарантию существования мажоритарного элемента?", options: ["Сразу вернуть кандидата", "Вторым проходом посчитать его вхождения и проверить, что их больше половины", "Вернуть последний элемент массива", "Отсортировать и вернуть максимум"], answer: 1, explain: "Первый проход находит кандидата, но без гарантии он может не составлять большинство."}
  - {id: algo-009, type: card, q: "Назови скрытые O(n) в Python.", answer: "`x in list`, `list.index`, `list.count`; `pop(0)` и `insert(0, x)`; срезы `a[i:j]`, `s[::-1]` (время и память); `startswith` — O(len(p)); `sum`, `min`, `max`; `sorted` — O(n log n). По `set` и `dict` проверка `in` — O(1) в среднем."}
  - {id: algo-010, type: choice, q: "Что считаем как память алгоритма?", options: ["Всё, включая вход", "Дополнительную память; результат функции отдельно", "Только стек", "Только переменные"], answer: 1, explain: "Поэтому `nums[i] += nums[i-1]` на месте — O(1) память."}
  - {id: algo-011, leetcode: [242], type: choice, q: "Сложность `sorted`?", options: ["O(n)", "O(n log n)", "O(n²)", "O(log n)"], answer: 1, explain: "Решение через `sorted` в LC 242 — O(n log n), счётчик — O(n)."}
  - {id: algo-012, type: choice, q: "Какая сложность `x in set` в худшем случае?", options: ["O(1) всегда", "O(n) при плохом хэше (в среднем O(1))", "O(log n)", "O(n²)"], answer: 1, explain: "Деградирует, когда много ключей попадают в одну ячейку."}
  - {id: algo-013, leetcode: [1480], type: choice, q: "Паттерн «префиксная сумма» (LC 1480)?", options: ["Максимум слева", "Накапливаем итог по ходу: каждый элемент хранит сумму всех до него", "Два словаря", "Рекурсия"], answer: 1, explain: "Основа задач на суммы подмассивов."}
  - {id: algo-014, leetcode: [121], type: choice, q: "Паттерн «минимум слева» (LC 121)?", options: ["Сортировка", "Один проход: держим минимум и лучший ответ", "Два указателя", "Бинпоиск"], answer: 1, explain: "O(n) время, O(1) память."}
  - {id: algo-015, leetcode: [205], type: choice, q: "Паттерн «двустороннее отображение» (LC 205)?", options: ["Один set", "Два словаря, чтобы пары символов были взаимно однозначны", "Сортировка", "Стек"], answer: 1, explain: "Проверяй и длины строк: `zip` молча обрежет."}
  - {id: algo-016, leetcode: [242], type: choice, q: "Почему память в LC 242 — O(1) для строчных латинских букв?", options: ["Нет словаря", "Ключей в словаре максимум 26 и их число не зависит от n; для Unicode это O(k)", "Словарь не занимает память", "Используется сортировка"], answer: 1, explain: "Размер алфавита — константа."}
