topic: algo-big-o
title: Алгоритмы — Big-O и паттерны хэш-таблиц
chapter: algo
week: 1
questions:
  - {id: algo-001, type: choice, q: "Как складываются сложности циклов?", options: ["Последовательные перемножаются, вложенные складываются", "Последовательные складываются, вложенные перемножаются", "Всегда складываются", "Всегда перемножаются"], answer: 1, explain: "И помни: встроенный метод внутри цикла считается как цикл."}
  - {id: algo-002, type: choice, q: "В цикле по n элементам стоит `if x in lst` (lst из n). Итог?", options: ["O(n)", "O(n log n)", "O(n²)", "O(1)"], answer: 2, explain: "`x in list` — O(n). Заменить на `set` — тогда O(n). Именно так в LC 349."}
  - {id: algo-003, type: choice, q: "Что такое «лучший случай» при фиксированном n?", options: ["Вход короче", "Вход того же размера, на котором работы меньше (ранний выход)", "Пустой вход", "Любой вход"], answer: 1, explain: "Пример LC 217: `[1, 1, ...]` выход на 2-й итерации, худший — дубликатов нет. Это повторяющаяся ошибка недели 1."}
  - {id: algo-004, type: choice, q: "Если ранних выходов нет, лучший и худший случай…", options: ["Лучший O(1)", "Совпадают", "Лучший O(log n)", "Определить нельзя"], answer: 1, explain: "Так в LC 268, 121, 13."}
  - {id: algo-005, type: choice, q: "Почему `startswith` на растущем префиксе в цикле даёт O(n·m²)?", options: ["startswith — O(1)", "startswith сравнивает до len(p) символов: скрытый цикл внутри цикла", "Срезы бесплатны", "Из-за рекурсии"], answer: 1, explain: "LC 14: сравнение «по столбцам» `s[i] == target[i]` даёт O(n·m)."}
  - {id: algo-006, type: choice, q: "Какой паттерн у задач «Contains Duplicate» и «Intersection of Two Arrays»?", options: ["Скользящее окно", "«Уже видел»: множество или словарь пройденных значений", "Бинарный поиск", "Два указателя"], answer: 1, explain: "Подсчёт частот — 242, 383, 169; дополнение до цели — LC 1."}
  - {id: algo-007, type: choice, q: "Как решается Two Sum за один проход?", options: ["Двумя вложенными циклами", "Словарь «значение → индекс»; для x ищем target − x среди виденных", "Сортировка и бинпоиск", "Префиксные суммы"], answer: 1, explain: "Поиск дополнения за O(1) даёт O(n) вместо O(n²)."}
  - {id: algo-008, type: choice, q: "Когда верно голосование Бойера–Мура (LC 169)?", options: ["Всегда", "Только если мажоритарный элемент гарантирован", "Только для отсортированного массива", "Только для чисел"], answer: 1, explain: "Иначе кандидат может оказаться случайным, и нужна проверка вторым проходом."}
  - {id: algo-009, type: card, q: "Назови скрытые O(n) в Python.", answer: "`x in list`, `list.index`, `list.count`; `pop(0)` и `insert(0, x)`; срезы `a[i:j]`, `s[::-1]` (время и память); `startswith` — O(len(p)); `sum`, `min`, `max`; `sorted` — O(n log n). По `set` и `dict` проверка `in` — O(1) в среднем."}
