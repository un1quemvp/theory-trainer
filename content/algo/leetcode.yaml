topic: algo-leetcode
title: Алгоритмы — паттерны решённых задач LeetCode
chapter: algo
week: 1
source: algorithms (репозиторий)
problems:
  1:
    title: Two Sum
    statement: Дан массив целых чисел и число `target`. Верни индексы двух разных элементов, сумма которых равна `target`. Ровно одна пара подходит.
    example: "`nums = [3, 2, 4]`, `target = 6` → `[1, 2]`."
    review: Твой перебор пар занимает O(n²) времени и O(1) дополнительной памяти. Словарь сокращает время до O(n) в среднем и требует O(n) памяти. Сначала ищи дополнение, затем записывай текущее число.
  13:
    title: Roman to Integer
    statement: Преобразуй корректную запись римского числа в целое число. В парах вроде IV и IX меньший символ перед большим вычитается.
    example: "`XLII` → `42`."
    review: В твоём решении сначала складываются все значения, затем из суммы вычитается удвоенное значение меньшего символа в каждой вычитающей паре. Сравнение с соседним символом позволяет сделать это за один проход. Оба варианта дают O(n) времени и O(1) дополнительной памяти.
  14:
    title: Longest Common Prefix
    statement: Найди самый длинный общий префикс всех строк. Если общего начала нет, верни пустую строку.
    example: "`['flower', 'flow', 'flight']` → `'fl'`."
    review: Твои растущие срезы и проверки startswith дают O(n·m²) времени и O(m) рабочей памяти. Сравнение по столбцам даёт O(n·m) времени и O(1) рабочей памяти без строки результата. Здесь n — число строк, m — длина кратчайшей.
  121:
    title: Best Time to Buy and Sell Stock
    statement: В массиве указана цена акции по дням. Выбери день покупки и более поздний день продажи, чтобы получить максимальную прибыль. Если прибыли нет, верни 0.
    example: "`[7, 1, 5, 3, 6, 4]` → `5`."
    review: Твой перебор дней покупки и продажи требует O(n²) времени. Один проход с минимумом цены слева занимает O(n). Оба подхода используют O(1) дополнительной памяти.
  169:
    title: Majority Element
    statement: Найди элемент, который встречается строго более чем в половине позиций массива. Такой элемент гарантирован.
    example: "`[2, 2, 1, 1, 1, 2, 2]` → `2`."
    review: Твой словарь частот даёт O(n) времени в среднем и O(n) памяти. Голосование Бойера–Мура тоже проходит за O(n), но хранит только кандидата и счётчик. Без гарантии нужен второй проход для проверки кандидата.
  205:
    title: Isomorphic Strings
    statement: Проверь, можно ли заменить символы первой строки так, чтобы получить вторую. Каждый символ всегда заменяется одинаково, а разные символы должны иметь разные образы.
    example: "`'egg'` и `'add'` → `True`. `'ab'` и `'aa'` → `False`."
    review: Твои два словаря проверяют отображение в обе стороны за O(n) времени в среднем и O(k) памяти, где k — число разных символов. Один словарь и множество занятых образов дают те же оценки.
  217:
    title: Contains Duplicate
    statement: Определи, встречается ли хоть одно число в массиве дважды или чаще.
    example: "`[1, 2, 3, 1]` → `True`."
    review: Вызов `count` для каждого элемента даёт O(n²) времени в худшем случае и O(1) дополнительной памяти. Храни уже встреченные числа в множестве для O(n) времени в среднем и O(n) памяти. Сортировка и проверка соседей занимают O(n log n) в худшем случае.
  242:
    title: Valid Anagram
    statement: Проверь, можно ли переставить буквы первой строки и получить вторую. В исходной задаче строки состоят из строчных латинских букв.
    example: "`'listen'` и `'silent'` → `True`."
    review: Твоё сравнение отсортированных строк требует O(n log n) времени и O(n) памяти. Подсчёт частот даёт O(n) времени и O(1) памяти для алфавита из 26 букв.
  268:
    title: Missing Number
    statement: В массиве длины n лежат разные числа из диапазона от 0 до n включительно. Найди единственное отсутствующее число.
    example: "`[3, 0, 1]` → `2`."
    review: Твой способ вычитает фактическую сумму из `n * (n + 1) // 2`. Альтернатива — XOR всех чисел диапазона и массива. Оба подхода занимают O(n) времени и O(1) памяти.
  349:
    title: Intersection of Two Arrays
    statement: Верни значения, которые встречаются в обоих массивах. Каждое значение выведи один раз, порядок произвольный.
    example: "`[1, 2, 2, 1]` и `[2, 2]` → `[2]`."
    review: Проверка вхождения в список может дать O(n·m). Твоё пересечение двух множеств даёт O(n + m) времени в среднем и O(n + m) дополнительной памяти. Можно построить множество только для меньшего массива и удалять из него уже выданные значения.
  383:
    title: Ransom Note
    statement: Определи, можно ли составить записку из символов журнала. Каждое вхождение символа в журнале можно использовать один раз. Алфавит — строчные латинские буквы.
    example: "`note = 'aa'`, `magazine = 'aab'` → `True`."
    review: Твоё вычёркивание из списка требует до O(n·m) времени и O(m) памяти. Счётчики букв журнала дают O(n + m) времени и O(1) памяти для фиксированного алфавита.
  387:
    title: First Unique Character in a String
    statement: Верни индекс первого символа, который встречается в строке один раз. Если такого символа нет, верни −1. Строка состоит из строчных латинских букв.
    example: "`'loveleetcode'` → `2`."
    review: Твой подсчёт частот и второй проход дают O(n) времени и O(1) памяти для 26 букв. Проверять `s.count(ch)` для каждой позиции проще, но в худшем случае это O(n²).
  448:
    title: Find All Numbers Disappeared in an Array
    statement: В массиве длины n все числа лежат в диапазоне от 1 до n включительно. Возможны повторы. Верни все числа из диапазона, которых в массиве нет.
    example: "`[4, 3, 2, 7, 8, 2, 3, 1]` → `[5, 6]`."
    review: Твоё множество даёт O(n) времени в среднем и O(n) дополнительной памяти. Пометки отрицательным знаком дают O(n) времени и O(1) памяти без результата, если можно изменить входной массив.
  1480:
    title: Running Sum of 1d Array
    statement: Построй массив, где каждый элемент равен сумме исходных значений от начала до этой позиции включительно.
    example: "`[1, 2, 3, 4]` → `[1, 3, 6, 10]`."
    review: Твой проход на месте использует O(n) времени и O(1) дополнительной памяти. Если надо сохранить вход, возвращай отдельный массив результата длины n, тоже за O(n) времени.
questions:
  - {id: lc-001, leetcode: [1], type: choice, q: "LC 1 Two Sum: за один проход за O(n)?", options: ["Два вложенных цикла", "Словарь «значение → индекс»; для x ищем target − x среди виденных", "Сортировка и два указателя на исходных индексах", "Бинарный поиск"], answer: 1, explain: "Поиск дополнения за O(1) вместо перебора."}
  - {id: lc-002, leetcode: [13], type: choice, q: "LC 13 Roman to Integer: ключевая идея?", options: ["Рекурсия", "Словарь значений символов; если меньший стоит перед большим, вычитаем", "Регулярные выражения", "Сортировка символов"], answer: 1, explain: "Один проход, O(n) время, O(1) память (фиксированный алфавит)."}
  - {id: lc-003, leetcode: [14], type: choice, q: "LC 14 Longest Common Prefix: как избежать O(n·m²)?", options: ["Сравнивать по столбцам: `s[i] == target[i]`, без срезов и startswith на растущем префиксе", "Отсортировать и склеить", "Использовать set", "Вернуть первую строку"], answer: 0, explain: "Срез `target[:i+1]` на каждой итерации возвращает O(m²)."}
  - {id: lc-004, leetcode: [121], type: card, q: "LC 121 Best Time to Buy and Sell Stock: идея и сложность?", answer: "Один проход: храним минимальную цену слева и лучший ответ `max(best, price − min_price)`. O(n) время, O(1) память."}
  - {id: lc-005, leetcode: [169], type: choice, q: "LC 169 Majority Element: решение за O(1) памяти?", options: ["Словарь частот", "Голосование Бойера–Мура: кандидат и счётчик (верно, если мажоритарный элемент гарантирован)", "Сортировка", "Set"], answer: 1, explain: "Словарь частот — O(n) память, сортировка — O(n log n)."}
  - {id: lc-006, leetcode: [205], type: card, q: "LC 205 Isomorphic Strings: идея?", answer: "Двустороннее отображение: два словаря (s→t и t→s), символы должны быть взаимно однозначны. Один проход, O(n); длины строк проверять отдельно (`zip` молча обрежет)."}
  - {id: lc-007, leetcode: [217], type: choice, q: "LC 217 Contains Duplicate: паттерн?", options: ["Подсчёт частот", "«Уже видел»: множество пройденных значений, ранний выход при повторе", "Два указателя", "Скользящее окно"], answer: 1, explain: "Лучший случай при фиксированном n: дубликат в начале; худший: дубликатов нет."}
  - {id: lc-008, leetcode: [242], type: card, q: "LC 242 Valid Anagram: идея и сложность?", answer: "Подсчёт частот символов в словаре (`d[c] = d.get(c, 0) + 1`), сравнение. O(n), память O(1) для ограниченного алфавита (O(k) для Unicode). Решение через `sorted` — O(n log n)."}
  - {id: lc-009, leetcode: [268], type: choice, q: "LC 268 Missing Number: решение за O(1) памяти?", options: ["Set", "n(n+1)/2 минус сумма массива (или XOR)", "Словарь", "Рекурсия"], answer: 1, explain: "XOR не боится переполнения в языках с фиксированными целыми."}
  - {id: lc-010, leetcode: [349], type: choice, q: "LC 349 Intersection of Two Arrays: как уйти от O(n·m)?", options: ["Вложенные циклы", "Превратить один массив в `set` и проверять `in` за O(1)", "Отсортировать оба и склеить", "Рекурсия"], answer: 1, explain: "`x in list` — O(n), `x in set` — O(1) в среднем."}
  - {id: lc-011, leetcode: [383], type: card, q: "LC 383 Ransom Note: идея и сложность?", answer: "Подсчёт символов `magazine`, затем вычитание по символам записки: не хватило — False. O(n + m), память O(1) для ограниченного алфавита. Вычёркивание из списка — O(n·m)."}
  - {id: lc-012, leetcode: [387], type: card, q: "LC 387 First Unique Character: идея?", answer: "Два прохода: сначала подсчёт частот символов, затем первый индекс символа с частотой 1. O(n) время, O(1) память (алфавит ограничен)."}
  - {id: lc-013, leetcode: [448], type: choice, q: "LC 448 Find All Numbers Disappeared: как за O(1) доп. памяти?", options: ["Set", "Пометить встреченные числа отрицательным знаком на позиции `abs(x) - 1`", "Сортировка с доп. массивом", "Словарь"], answer: 1, explain: "Для каждого x присвой `nums[abs(x) - 1] = -abs(nums[abs(x) - 1])`. В конце положительные элементы отмечают пропуски. Для положительного элемента на позиции i верни i + 1."}
  - {id: lc-014, leetcode: [1480], type: choice, q: "LC 1480 Running Sum: оптимальное решение?", options: ["Двойной цикл O(n²)", "Префиксная сумма на месте: `nums[i] += nums[i−1]`, O(n) время, O(1) память", "Рекурсия", "Словарь"], answer: 1, explain: "Меняет входные данные; для сохранения входа нужна копия (O(n))."}
