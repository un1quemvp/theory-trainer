topic: algo-leetcode
title: Алгоритмы — паттерны решённых задач LeetCode
chapter: algo
week: 1
source: algorithms (репозиторий)
questions:
  - {id: lc-001, type: choice, q: "LC 1 Two Sum: за один проход за O(n)?", options: ["Два вложенных цикла", "Словарь «значение → индекс»; для x ищем target − x среди виденных", "Сортировка и два указателя на исходных индексах", "Бинарный поиск"], answer: 1, explain: "Поиск дополнения за O(1) вместо перебора."}
  - {id: lc-002, type: choice, q: "LC 13 Roman to Integer: ключевая идея?", options: ["Рекурсия", "Словарь значений символов; если меньший стоит перед большим, вычитаем", "Регулярные выражения", "Сортировка символов"], answer: 1, explain: "Один проход, O(n) время, O(1) память (фиксированный алфавит)."}
  - {id: lc-003, type: choice, q: "LC 14 Longest Common Prefix: как избежать O(n·m²)?", options: ["Сравнивать по столбцам: `s[i] == target[i]`, без срезов и startswith на растущем префиксе", "Отсортировать и склеить", "Использовать set", "Вернуть первую строку"], answer: 0, explain: "Срез `target[:i+1]` на каждой итерации возвращает O(m²)."}
  - {id: lc-004, type: card, q: "LC 121 Best Time to Buy and Sell Stock: идея и сложность?", answer: "Один проход: храним минимальную цену слева и лучший ответ `max(best, price − min_price)`. O(n) время, O(1) память."}
  - {id: lc-005, type: choice, q: "LC 169 Majority Element: решение за O(1) памяти?", options: ["Словарь частот", "Голосование Бойера–Мура: кандидат и счётчик (верно, если мажоритарный элемент гарантирован)", "Сортировка", "Set"], answer: 1, explain: "Словарь частот — O(n) память, сортировка — O(n log n)."}
  - {id: lc-006, type: card, q: "LC 205 Isomorphic Strings: идея?", answer: "Двустороннее отображение: два словаря (s→t и t→s), символы должны быть взаимно однозначны. Один проход, O(n); длины строк проверять отдельно (`zip` молча обрежет)."}
  - {id: lc-007, type: choice, q: "LC 217 Contains Duplicate: паттерн?", options: ["Подсчёт частот", "«Уже видел»: множество пройденных значений, ранний выход при повторе", "Два указателя", "Скользящее окно"], answer: 1, explain: "Лучший случай при фиксированном n: дубликат в начале; худший: дубликатов нет."}
  - {id: lc-008, type: card, q: "LC 242 Valid Anagram: идея и сложность?", answer: "Подсчёт частот символов в словаре (`d[c] = d.get(c, 0) + 1`), сравнение. O(n), память O(1) для ограниченного алфавита (O(k) для Unicode). Решение через `sorted` — O(n log n)."}
  - {id: lc-009, type: choice, q: "LC 268 Missing Number: решение за O(1) памяти?", options: ["Set", "n(n+1)/2 минус сумма массива (или XOR)", "Словарь", "Рекурсия"], answer: 1, explain: "XOR не боится переполнения в языках с фиксированными целыми."}
  - {id: lc-010, type: choice, q: "LC 349 Intersection of Two Arrays: как уйти от O(n·m)?", options: ["Вложенные циклы", "Превратить один массив в `set` и проверять `in` за O(1)", "Отсортировать оба и склеить", "Рекурсия"], answer: 1, explain: "`x in list` — O(n), `x in set` — O(1) в среднем."}
  - {id: lc-011, type: card, q: "LC 383 Ransom Note: идея и сложность?", answer: "Подсчёт символов `magazine`, затем вычитание по символам записки: не хватило — False. O(n + m), память O(1) для ограниченного алфавита. Вычёркивание из списка — O(n·m)."}
  - {id: lc-012, type: card, q: "LC 387 First Unique Character: идея?", answer: "Два прохода: сначала подсчёт частот символов, затем первый индекс символа с частотой 1. O(n) время, O(1) память (алфавит ограничен)."}
  - {id: lc-013, type: choice, q: "LC 448 Find All Numbers Disappeared: как за O(1) доп. памяти?", options: ["Set", "Пометка в самом массиве: для каждого x обнуляем знак у `nums[x−1]`, позитивные индексы — пропущенные", "Сортировка с доп. массивом", "Словарь"], answer: 1, explain: "Меняет входной массив (компромисс «память за время и сохранность входа»)."}
  - {id: lc-014, type: choice, q: "LC 1480 Running Sum: оптимальное решение?", options: ["Двойной цикл O(n²)", "Префиксная сумма на месте: `nums[i] += nums[i−1]`, O(n) время, O(1) память", "Рекурсия", "Словарь"], answer: 1, explain: "Меняет входные данные; для сохранения входа нужна копия (O(n))."}
