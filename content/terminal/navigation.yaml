topic: terminal-navigation
title: Терминал — навигация и файлы
chapter: terminal
week: 1
questions:
  - {id: term-nav-001, type: choice, q: "Чем терминал отличается от shell?", options: ["Это одно и то же", "Терминал — окно для ввода, shell (bash) — программа, которая читает и запускает команды", "Терминал — программа, shell — окно", "Shell есть только в Windows"], answer: 1, explain: "Терминал показывает текст, а команды разбирает и запускает оболочка (у тебя bash)."}
  - {id: term-nav-002, type: choice, q: "Папка `a` лежит в `~/sandbox`. Почему `cd /a/b/c` не сработает?", options: ["Нет права x", "Путь с `/` — абсолютный, Linux ищет `a` в корне системы", "Нужно `cd -p`", "Папка `c` пустая"], answer: 1, explain: "Относительный путь пишется без `/` в начале: `cd a/b/c`."}
  - {id: term-nav-003, type: choice, q: "Что делает `cd -`?", options: ["Идёт в домашнюю папку", "Поднимается на уровень выше", "Возвращает в предыдущую папку", "Удаляет текущую папку"], answer: 2, explain: "`cd` без аргументов ведёт домой, `cd ..` — на уровень выше, `cd -` — назад."}
  - {id: term-nav-004, type: choice, q: "`mkdir a/b/c` падает, если `a/b` не существует. Что добавить?", options: ["-r", "-p", "-f", "sudo"], answer: 1, explain: "`mkdir -p` создаёт всю цепочку. Флага `-r` у mkdir нет — это путаница с `cp -r`."}
  - {id: term-nav-005, type: choice, q: "Где в WSL виден диск D: Windows?", options: ["/d", "/mnt/d", "/home/d", "/media/d"], answer: 1, explain: "Диски Windows монтируются в `/mnt/c`, `/mnt/d`. Проекты лучше держать в `~/projects`."}
  - {id: term-nav-006, type: choice, q: "Кто превращает `*.py` в список файлов в `ls *.py`?", options: ["Команда ls", "Оболочка (shell), до запуска ls", "Ядро Linux", "Python"], answer: 1, explain: "Подстановку `*` делает shell, поэтому она работает с любой командой одинаково."}
  - {id: term-nav-007, type: card, q: "Почему `rm -rf` опасен и как подстраховаться?", answer: "Корзины нет, удаление навсегда, `-f` не спрашивает. Перед Enter проверить `pwd` и путь (лишний пробел может снести всё), использовать `rm -i`, с `*` быть вдвойне осторожным."}
  - {id: term-nav-008, type: choice, q: "Что покажет `ls -la`?", options: ["Только папки", "Все файлы, включая скрытые (с точки), в подробном формате", "Только скрытые", "Размер диска"], answer: 1, explain: "`-l` подробно, `-a` все, `-h` размеры по-человечески, `-R` рекурсивно."}
  - {id: term-nav-009, type: choice, q: "Что будет при `cp a a_copy`, если `a` — папка, без `-r`?", options: ["Папка скопируется", "cp откажется копировать папку: нужен `cp -r`", "Скопируется только имя", "Папка переместится"], answer: 1, explain: "Без `-r` копируются только файлы."}
  - {id: term-nav-010, type: choice, q: "Что такое `.` и `..` в папке?", options: ["Скрытые файлы-ловушки", "Реальные записи: текущая папка и родительская", "Корень и домашняя папка", "Симлинки на /tmp"], answer: 1, explain: "`cd ..` вверх, `./script.sh` — из текущей папки. `ls -A` скрытые без `.` и `..`."}
  - {id: term-nav-011, type: choice, q: "Когда `less`, а когда `cat`?", options: ["Это синонимы", "cat выводит файл целиком (для коротких), less листает постранично (выход `q`, поиск `/слово`)", "less редактирует файл", "cat листает"], answer: 1, explain: "Тот же пейджер использует `git log` и `man`."}
  - {id: term-nav-012, type: choice, q: "Как следить за логом в реальном времени?", options: ["head -f", "tail -f файл", "cat -f", "less -n"], answer: 1, explain: "`tail -n 20` — последние 20 строк, `-f` — следить за добавлением."}
  - {id: term-nav-013, type: choice, q: "Какая команда и переименовывает, и переносит файлы?", options: ["cp", "mv", "rn", "ren"], answer: 1, explain: "`mv old new`. Как и `cp`, молча перезаписывает существующий файл (флаг `-i` спросит)."}
  - {id: term-nav-014, type: choice, q: "`Readme.md` и `README.md` в Linux…", options: ["Один файл", "Разные файлы: регистр важен", "Ошибка при создании", "Один файл, если в одной папке"], answer: 1, explain: "Поэтому в именах решений используем строгий формат `NNNN-kebab-case.py`."}
