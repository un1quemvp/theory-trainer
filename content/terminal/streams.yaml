topic: terminal-streams
title: Терминал — потоки, пайпы, grep, find
chapter: terminal
week: 1
questions:
  - {id: term-str-001, type: choice, q: "Номера stdin, stdout, stderr?", options: ["1, 2, 3", "0, 1, 2", "0, 2, 1", "1, 0, 2"], answer: 1, explain: "Ввод 0, вывод 1, ошибки 2. Ошибки идут отдельным потоком и не попадают в пайп."}
  - {id: term-str-002, type: choice, q: "Чем `>` отличается от `>>`?", options: ["Ничем", "`>` перезаписывает файл, `>>` дописывает в конец", "`>` дописывает, `>>` перезаписывает", "`>>` работает только с ошибками"], answer: 1, explain: "`>` молча стирает содержимое — частая ошибка."}
  - {id: term-str-003, type: choice, q: "Что значит `2>&1`?", options: ["Ошибки туда же, куда обычный вывод", "Ошибки в /dev/null", "Вывод в файл 2", "Повторить команду дважды"], answer: 0, explain: "`cmd > out.txt 2>&1` пишет и вывод, и ошибки в один файл."}
  - {id: term-str-004, type: choice, q: "Почему `uniq` почти всегда после `sort`?", options: ["uniq работает только с файлами", "uniq схлопывает только соседние одинаковые строки", "sort ускоряет uniq", "Так требует bash"], answer: 1, explain: "`sort f | uniq -c` считает повторы; `| sort -nr` даёт топ по частоте."}
  - {id: term-str-005, type: choice, q: "`sort f | uniq -c f` даёт неверный результат. Почему?", options: ["Нужен sudo", "Раз у uniq указан файл, он читает его и игнорирует пайп", "`-c` не работает с пайпом", "sort портит файл"], answer: 1, explain: "Файл-аргумент перекрывает пайп. Правильно: `uniq -c` без имени файла."}
  - {id: term-str-006, type: choice, q: "Чем `grep` отличается от `find`?", options: ["Это синонимы", "grep ищет внутри файлов, find — сами файлы по имени, типу, размеру, дате", "grep ищет файлы, find — текст", "find работает только в корне"], answer: 1, explain: "Комбинация: `find . -name \"*.py\" | xargs grep -n import`."}
  - {id: term-str-007, type: choice, q: "Как найти пустые `.py` в текущей папке и ниже?", options: ["grep -L .py", "find . -name \"*.py\" -size 0", "ls -S *.py", "wc -l *.py"], answer: 1, explain: "Маску `-name` берут в кавычки, чтобы её раскрыл find, а не shell."}
  - {id: term-str-008, type: card, q: "Чем различаются `|`, `;` и `&&`?", answer: "`|` — вывод первой команды идёт на ввод второй, запускаются одновременно. `;` — по очереди, независимо от результата. `&&` — вторая только если первая завершилась успешно."}
  - {id: term-str-009, type: choice, q: "Что делает `2> /dev/null`?", options: ["Пишет ошибки в файл", "Выбрасывает ошибки (/dev/null — «чёрная дыра»)", "Создаёт папку", "Дублирует вывод"], answer: 1, explain: "`/dev/null` — не папка, а специальное устройство."}
  - {id: term-str-010, type: choice, q: "Что делает `tee`?", options: ["Удаляет вывод", "Пишет вывод и в файл, и дальше по пайпу или на экран", "Сортирует", "Считает строки"], answer: 1, explain: "`ls -l | tee list.txt | wc -l`."}
  - {id: term-str-011, type: choice, q: "Что делает `wc -l`?", options: ["Считает слова", "Считает строки", "Считает байты", "Ищет текст"], answer: 1, explain: "`-w` слова, `-c` байты."}
  - {id: term-str-012, type: choice, q: "Что делает `grep -v \"#\" f`?", options: ["Ищет только строки с `#`", "Выводит строки, где шаблона нет", "Считает `#`", "Удаляет `#` из файла"], answer: 1, explain: "`-v` — инверсия. `-c` счёт, `-l` / `-L` имена файлов с совпадением / без."}
  - {id: term-str-013, type: choice, q: "Что делает `grep -rn \"def \" ~/projects`?", options: ["Ищет по одному файлу", "Рекурсивно по папке, с номерами строк", "Ищет только имена файлов", "Удаляет совпадения"], answer: 1, explain: "`-r` рекурсивно, `-n` номера строк, `-i` без регистра."}
  - {id: term-str-014, type: choice, q: "Зачем `xargs` в `find . -name \"*.py\" | xargs grep import`?", options: ["Ускоряет find", "Превращает строки из stdin в аргументы команды (grep -r пайп не читает)", "Сортирует", "Не нужен"], answer: 1, explain: "Короче и надёжнее: `grep -rn import . --include=\"*.py\"`."}
  - {id: term-str-015, type: choice, q: "`ls aaaa 2> errors.txt`, потом `cat errors.txt`. Что увидишь?", options: ["Пустой файл", "Сообщение `No such file or directory`", "Список файлов", "Ничего, команда упала"], answer: 1, explain: "Ошибка — это stderr, он ушёл в файл, а на экран ничего не вышло."}
