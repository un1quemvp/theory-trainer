topic: terminal-permissions
title: Терминал — права и chmod
chapter: terminal
week: 1
questions:
  - {id: term-perm-001, type: choice, q: "Расшифруй `drwxr-x---`", options: ["Файл; владелец rwx, группа r-x, остальные ничего", "Папка; владелец rwx, группа r-x, остальные ничего", "Папка; все могут всё", "Файл; владелец r-x"], answer: 1, explain: "Первый символ — тип (`d` папка), дальше три тройки: владелец, группа, остальные."}
  - {id: term-perm-002, type: choice, q: "Что означает `751`?", options: ["rwxr-x--x", "rwxr-xr-x", "rw-r-x--x", "rwx--xr-x"], answer: 0, explain: "7 = rwx, 5 = r-x, 1 = --x (r=4, w=2, x=1)."}
  - {id: term-perm-003, type: choice, q: "Права на приватный SSH-ключ?", options: ["644", "777", "600", "755"], answer: 2, explain: "Ключ равен паролю. При слишком открытых правах ssh откажется им пользоваться («Permissions are too open»)."}
  - {id: term-perm-004, type: choice, q: "Что даёт право `x` на папку?", options: ["Запуск папки как программы", "Вход (`cd`) и доступ к файлам внутри", "Удаление папки", "Только просмотр списка файлов"], answer: 1, explain: "Для файла `x` — запускать, для папки — входить. Список файлов даёт `r`."}
  - {id: term-perm-005, type: choice, q: "У `hello.sh` права `600`. Что получится?", options: ["`./hello.sh` запустится", "`./hello.sh` не запустится (нет x), но `bash hello.sh` сработает", "Не сработает ничего", "Сработает только с sudo"], answer: 1, explain: "`bash` просто читает файл, ему хватает `r`. Для `./` нужен `x`."}
  - {id: term-perm-006, type: choice, q: "Зачем `./` перед именем скрипта?", options: ["Это комментарий", "Оболочка не ищет программы в текущей папке, только в `PATH`", "Чтобы скрыть вывод", "Чтобы запустить от root"], answer: 1, explain: "`./hello.sh` — «запусти из текущей папки»."}
  - {id: term-perm-007, type: choice, q: "Что значит `644`?", options: ["rwxr-xr-x", "rw-r--r--", "rw-------", "r--r--r--"], answer: 1, explain: "Типично для обычных файлов. 755 — скрипты и папки, 600 — ключи, 700 — приватные папки."}
  - {id: term-perm-008, type: choice, q: "Что делает `chmod u+x deploy.sh`?", options: ["Даёт всем право запуска", "Добавляет владельцу право запуска", "Забирает права у группы", "Делает файл root-овым"], answer: 1, explain: "`u` владелец, `g` группа, `o` остальные, `a` все; `+` добавить, `-` убрать, `=` установить."}
  - {id: term-perm-009, type: choice, q: "Какие права у папки `~/.ssh`?", options: ["755", "700", "777", "644"], answer: 1, explain: "Приватный ключ — 600, публичный — 644, `authorized_keys` и `config` — 600."}
  - {id: term-perm-010, type: choice, q: "Что делает `chown`?", options: ["Меняет права", "Меняет владельца и группу (обычно нужен sudo)", "Удаляет файл", "Меняет имя"], answer: 1, explain: "`chmod` — права, `chown` — владелец."}
  - {id: term-perm-011, type: choice, q: "Что делает `sudo команда`?", options: ["Запускает команду навсегда от root", "Выполняет одну команду от имени root", "Меняет пароль", "Создаёт пользователя"], answer: 1, explain: "Постоянно под root работать не стоит."}
  - {id: term-perm-012, type: choice, q: "Почему `chmod 777` «чтобы заработало» — плохая идея?", options: ["Не работает", "Любой пользователь сможет читать, менять и запускать файл: дыра в безопасности", "Замедляет систему", "Ломает Git"], answer: 1, explain: "Лучше разобраться, какое право реально нужно."}
  - {id: term-perm-013, type: choice, q: "Что особенного с правами на дисках Windows в WSL (`/mnt/c`, `/mnt/d`)?", options: ["Ничего", "Права Linux там эмулируются, `chmod` может не работать", "Диски только для чтения", "Права всегда 000"], answer: 1, explain: "Ещё одна причина держать проекты в `~/projects`."}
