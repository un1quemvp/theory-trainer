topic: net-basics
title: Сети — IP, DNS, TCP, TLS
chapter: net
week: 2
questions:
  - {id: net-001, type: choice, q: "Что значит `/24` в `192.168.1.10/24`?", options: ["24 устройства", "Первые 24 бита — сеть: маска 255.255.255.0, 256 адресов (254 для устройств)", "Порт 24", "24 бита хоста"], answer: 1, explain: "`/16` — 65 536 адресов, `/30` — 4. Чем число больше, тем меньше адресов."}
  - {id: net-002, type: choice, q: "Что такое `127.0.0.1`?", options: ["Адрес роутера", "Loopback: этот же компьютер (localhost)", "Публичный адрес Google", "Широковещательный адрес"], answer: 1, explain: "Локальный сервер доступен по нему. Частные диапазоны: 10/8, 172.16/12, 192.168/16."}
  - {id: net-003, type: multi, q: "Какие пары порт — сервис верны? (выбери все)", options: ["22 — SSH", "443 — HTTPS", "5432 — PostgreSQL", "80 — DNS"], answer: [0, 1, 2], explain: "DNS — 53, HTTP — 80, Redis — 6379."}
  - {id: net-004, type: choice, q: "Что делает NAT?", options: ["Шифрует трафик", "Домашние устройства с частными адресами выходят в интернет под одним публичным адресом роутера", "Переводит имя в адрес", "Выдаёт MAC-адреса"], answer: 1, explain: "Поэтому из интернета нельзя просто так подключиться к устройству за роутером."}
  - {id: net-005, type: choice, q: "Чем TCP отличается от UDP?", options: ["TCP: соединение, гарантированная доставка по порядку; UDP: без соединения и гарантий, зато дешевле", "UDP надёжнее", "TCP только для почты", "Разницы нет"], answer: 0, explain: "HTTP, SSH, БД — TCP; DNS-запросы, видеозвонки, игры, QUIC — UDP."}
  - {id: net-006, type: choice, q: "Что хранит запись DNS `A`, а что `CNAME`?", options: ["A: имя → IPv4; CNAME: имя-псевдоним → другое имя", "A: почта; CNAME: IPv6", "A: текст; CNAME: серверы домена", "Одно и то же"], answer: 0, explain: "`AAAA` — IPv6, `MX` — почта, `NS` — серверы домена, `TXT` — текст."}
  - {id: net-007, type: choice, q: "Когда в цепочке включается TLS?", options: ["До DNS", "После TCP-рукопожатия и до первого HTTP-запроса", "После ответа сервера", "Вместо TCP"], answer: 1, explain: "TLS даёт конфиденциальность, целостность и подлинность сервера (сертификат от CA)."}
  - {id: net-008, type: order, q: "Трёхстороннее рукопожатие TCP", items: ["Клиент → сервер: SYN", "Сервер → клиент: SYN-ACK", "Клиент → сервер: ACK"], explain: "Соединение стоит одной круговой задержки (RTT), поэтому важен keep-alive."}
  - {id: net-009, type: order, q: "Контрольный вопрос недели 2: от ввода адреса до страницы", items: ["DNS: имя → IP", "TCP: рукопожатие", "TLS: сертификат и ключ", "HTTP-запрос GET", "Ответ сервера и отрисовка страницы"], explain: "Кэшируются DNS-ответы, соединение (keep-alive) и сами ответы (Cache-Control)."}
