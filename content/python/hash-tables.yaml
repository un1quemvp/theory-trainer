topic: python-hash
title: Python — list, dict, set, хэш-таблицы
chapter: python
week: 1
questions:
  - {id: hash-001, type: choice, q: "Что такое `list` в Python внутри?", options: ["Связный список", "Динамический массив ссылок на объекты", "Хэш-таблица", "Дерево"], answer: 1, explain: "Доступ `lst[i]` — O(1), вставка и удаление в начале — O(n). У связного списка наоборот."}
  - {id: hash-002, type: choice, q: "Почему `append` в среднем O(1), хотя иногда копирует весь массив?", options: ["Копирования не бывает", "Массив выделяется с запасом, копирование редкое, стоимость размазывается (амортизированно)", "append пишет в файл", "Python использует связный список"], answer: 1, explain: "Так же вставка в `dict` амортизированно O(1) при расширении таблицы."}
  - {id: hash-003, type: choice, q: "Почему `pop(0)` и `insert(0, x)` стоят O(n)?", options: ["Нужно пересчитать хэши", "Все остальные элементы сдвигаются на одну ячейку", "Список сортируется", "Нужна блокировка"], answer: 1, explain: "Для очереди используют `collections.deque`."}
  - {id: hash-004, type: choice, q: "Почему `x in lst` — O(n), а `x in st` — в среднем O(1)?", options: ["list медленнее написан", "list проверяет элементы по очереди, set идёт сразу в ячейку по хэшу", "set отсортирован", "Это одно и то же"], answer: 1, explain: "`in` по списку внутри цикла — скрытый O(n²). Замена на set дала выигрыш в LC 349."}
  - {id: hash-005, type: choice, q: "Почему ключом `dict` не может быть `list`?", options: ["Список слишком длинный", "Список изменяем, его хэш не постоянен — ключ «потеряется» в таблице", "У списка нет `==`", "Так решил Гвидо"], answer: 1, explain: "Нужен хэшируемый объект: `int`, `str`, `tuple` из хэшируемых, `frozenset`. Кортеж с списком внутри тоже нельзя."}
  - {id: hash-006, type: choice, q: "Что такое коллизия и как с ней справляется `dict`?", options: ["Два ключа дали одну ячейку; Python использует открытую адресацию", "Ключ не найден; Python бросает KeyError", "Таблица переполнена; Python завершается", "Два значения равны; Python удаляет одно"], answer: 0, explain: "Второй классический способ — цепочки (в книге «Грокаем алгоритмы»)."}
  - {id: hash-007, type: choice, q: "Сколько ключей в `{1: \"a\", 1.0: \"b\", True: \"c\"}`?", options: ["3", "2", "1", "Ошибка"], answer: 2, explain: "`1 == 1.0 == True`, и хэши совпадают, значит это один и тот же ключ (останется значение \"c\")."}
  - {id: hash-008, type: choice, q: "Как создать пустое множество?", options: ["{}", "set()", "[]", "set{}"], answer: 1, explain: "`{}` — это пустой словарь, `type({})` вернёт `dict`."}
  - {id: hash-009, type: card, q: "Контрольный вопрос недели 1: почему поиск в хэш-таблице в среднем O(1) и когда он деградирует до O(n)?", answer: "Хэш-функция превращает ключ в номер ячейки, доступ к ячейке O(1), при равномерном хэше и небольшом коэффициенте заполнения в ячейке 0–1 ключ. Если много ключей дают один хэш (плохая функция или таблица почти полна), поиск превращается в перебор цепочки: в худшем случае все ключи в одной ячейке и O(n)."}
