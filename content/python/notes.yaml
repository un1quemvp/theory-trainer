topic: python-notes
title: Python — заметки и ловушки
chapter: python
week: 1
questions:
  - {id: py-notes-001, type: choice, q: "Что сделает `zip(a, b)` с последовательностями разной длины?", options: ["Бросит ошибку", "Молча остановится на самой короткой", "Дополнит None", "Вернёт пустой результат"], answer: 1, explain: "В Python 3.10+ есть `zip(a, b, strict=True)`, он бросит ошибку при разной длине."}
  - {id: py-notes-002, type: choice, q: "Что найдёт `max(d)` для словаря `d`?", options: ["Максимальное значение", "Максимальный ключ", "Ключ с максимальным значением", "Длину"], answer: 1, explain: "По значению: `max(d, key=d.get)`."}
  - {id: py-notes-003, type: choice, q: "Что вернут `all([])` и `any([])`?", options: ["True и False", "False и False", "True и True", "Ошибку"], answer: 0, explain: "Для пустой последовательности `all` истинно (нет нарушителей), `any` ложно (нет подходящих)."}
  - {id: py-notes-004, type: choice, q: "Что стоит `s[::-1]` для строки длиной k?", options: ["O(1), это вид", "O(k) по времени и по памяти: срез создаёт копию", "O(log k)", "O(k²)"], answer: 1, explain: "Срезы копируют. `s += c` в цикле тоже копирует строку целиком: строки неизменяемы."}
  - {id: py-notes-005, type: choice, q: "Как правильно считать частоты в словаре?", options: ["d[x] += 1", "d[x] = d.get(x, 0) + 1", "d.add(x)", "d.append(x)"], answer: 1, explain: "`d[x] += 1` бросит KeyError для нового ключа (если не `defaultdict`/`Counter`)."}
  - {id: py-notes-006, type: choice, q: "Какой оператор даёт пересечение множеств?", options: ["a | b", "a - b", "a & b", "a ^ b"], answer: 2, explain: "`|` объединение, `-` разность, `^` симметрическая разность. Пересечение в среднем O(min(len a, len b))."}
  - {id: py-notes-007, type: choice, q: "Чем опасно называть переменную `sum` или `list`?", options: ["Ничем", "Имя затеняет встроенную функцию", "Это синтаксическая ошибка", "Python тормозит"], answer: 1, explain: "После `sum = 0` вызвать `sum(...)` уже нельзя."}
  - {id: py-notes-008, type: choice, q: "Что даёт `s[0] = \"x\"` для строки?", options: ["Меняет символ", "TypeError: строки неизменяемы", "Добавляет символ", "Ничего"], answer: 1, explain: "`s += c` в цикле каждый раз копирует строку целиком."}
  - {id: py-notes-009, leetcode: [14], type: choice, q: "Сколько стоит `s.startswith(p)`?", options: ["O(1)", "O(len(p))", "O(len(s))", "O(log n)"], answer: 1, explain: "В цикле с растущим префиксом это скрытый цикл (LC 14)."}
  - {id: py-notes-010, type: choice, q: "Что даёт `a - b` для множеств?", options: ["Пересечение", "Элементы a, которых нет в b", "Объединение", "Симметрическую разность"], answer: 1, explain: "`a ^ b` — элементы, которые есть ровно в одном из множеств."}
  - {id: py-notes-011, type: choice, q: "Что даёт `a ^ b` для множеств?", options: ["Пересечение", "Элементы, которые есть ровно в одном из множеств", "Объединение", "Разность"], answer: 1, explain: "Симметрическая разность."}
  - {id: py-notes-012, leetcode: [1480], type: choice, q: "Плюс и минус изменения входного массива на месте (LC 1480)?", options: ["Без плюсов, без минусов", "Экономит память O(1), но портит входной массив", "Быстрее и безопаснее", "Только минус"], answer: 1, explain: "Если вход нужен целым, нужна копия (O(n))."}
  - {id: py-notes-013, type: choice, q: "Сложность `sum(lst)`, `min(lst)`, `max(lst)`?", options: ["O(1)", "O(n)", "O(log n)", "O(n²)"], answer: 1, explain: "Встроенная функция внутри цикла считается как цикл."}
  - {id: py-notes-014, leetcode: [387], type: choice, q: "Что даёт `for i, ch in enumerate(s)`?", options: ["Только символы", "Пару (индекс, символ)", "Только индексы", "Длину"], answer: 1, explain: "Нужен, когда в ответе требуется позиция (LC 387)."}
  - {id: py-notes-015, type: choice, q: "Что вернёт `d.get(k)`, если ключа нет и default не задан?", options: ["0", "None", "KeyError", "\"\""], answer: 1, explain: "`d.get(k, 0)` вернёт 0."}
  - {id: py-notes-016, type: choice, q: "Что значит `\"ab\" in \"cabd\"`?", options: ["Принадлежность символа", "Проверка подстроки: True", "Ошибка", "False"], answer: 1, explain: "Для строк `in` — подстрока, для списка и set — элемент."}
