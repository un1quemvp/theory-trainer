topic: git-basics
title: Git — основы и рабочий цикл
chapter: git
week: 1
questions:
  - {id: git-basics-001, type: choice, q: "Что делает `git add`?", options: ["Создаёт коммит", "Кладёт изменения в индекс (то, что уедет в следующий коммит)", "Отправляет на GitHub", "Удаляет файл"], answer: 1, explain: "Три места: рабочая папка, индекс, репозиторий (.git). Коммит берёт содержимое индекса."}
  - {id: git-basics-002, type: choice, q: "Чем `git diff` отличается от `git diff --staged`?", options: ["Ничем", "diff — изменения, ещё не добавленные в индекс; --staged — то, что уйдёт в коммит", "--staged сравнивает с GitHub", "diff показывает историю"], answer: 1, explain: "Перед коммитом проверяй `git diff --staged`: ровно то, что окажется в коммите."}
  - {id: git-basics-003, type: choice, q: "Что такое `origin/main`?", options: ["Ветка на моём компьютере, которую я двигаю коммитами", "Локальная запись о том, где была `main` на GitHub при последнем обмене; двигается при push, fetch, pull", "Имя репозитория", "Удалённый сервер"], answer: 1, explain: "`origin` — короткое имя адреса на GitHub. `ahead of origin/main by N` — N коммитов есть только у меня."}
  - {id: git-basics-004, type: choice, q: "Что делает `-u` в `git push -u origin main`?", options: ["Принудительная отправка", "Связывает локальную `main` с `origin/main`, дальше хватает `git push`", "Обновляет репозиторий", "Удаляет ветку"], answer: 1, explain: "Нужен только при первой отправке ветки."}
  - {id: git-basics-005, type: choice, q: "Какой репозиторий создавать на GitHub, если локальная история уже есть?", options: ["С README", "С README и .gitignore", "Пустой, без файлов", "С лицензией"], answer: 2, explain: "Иначе получатся две разные истории, которые придётся сливать."}
  - {id: git-basics-006, type: multi, q: "Что не коммитят? (выбери все верные)", options: [".venv/", "__pycache__/", ".vscode/ (настройки редактора)", "сам файл .gitignore"], answer: [0, 1, 2], explain: "Сам `.gitignore` как раз коммитится. Секреты тоже не коммитят."}
  - {id: git-basics-007, type: choice, q: "В файле с конфликтом между `<<<<<<< HEAD` и `=======` лежит…", options: ["Версия вливаемой ветки", "Версия той ветки, на которой ты стоишь при слиянии", "Общий предок", "Версия с GitHub"], answer: 1, explain: "Сверху всегда то, где стоит HEAD, снизу то, что приходит. Имя после `>>>>>>>` — вливаемая ветка."}
  - {id: git-basics-008, type: choice, q: "Какое сообщение коммита оформлено по нашему формату?", options: ["added stuff", "Add solution for 242 Valid Anagram", "fix", "Solution of the task #242."], answer: 1, explain: "По-английски, глагол в повелительном наклонении с большой буквы (Add, Fix, Update) и название объекта."}
