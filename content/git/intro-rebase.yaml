topic: git-intro
title: "Git — learngitbranching: коммиты, merge, rebase"
chapter: git
week: 1
questions:
  - {id: git-intro-001, type: choice, q: "Ты на ветке `bugFix` и делаешь `git commit`. Что сдвигается?", options: ["Только HEAD", "Указатель `bugFix` на новый коммит, HEAD едет вместе с ним", "`main`", "Ничего"], answer: 1, explain: "HEAD указывает на ветку, а не на коммит, поэтому переезжает вместе с ней."}
  - {id: git-intro-002, type: choice, q: "Что делает `git rebase main` на ветке `feature`?", options: ["Создаёт коммит слияния", "Создаёт копии коммитов `feature` поверх `main`, история получается линейной", "Удаляет `feature`", "Отправляет на GitHub"], answer: 1, explain: "На схеме копии с апострофом (C2'). Потом merge делается как fast-forward."}
  - {id: git-intro-003, type: choice, q: "Почему нельзя делать rebase опубликованных коммитов?", options: ["Git запрещает", "Rebase переписывает историю: у других останутся старые коммиты, начнётся путаница", "Rebase удаляет файлы", "Он слишком медленный"], answer: 1, explain: "Rebase — только для своих неопубликованных коммитов. Merge безопасен всегда."}
  - {id: git-intro-004, type: card, q: "Сравни merge и rebase.", answer: "Merge сохраняет историю как была, видны развилки, создаёт один коммит слияния с двумя родителями, историю не переписывает, безопасен всегда. Rebase даёт линейную историю, создаёт копии переносимых коммитов, историю переписывает, безопасен только для своих неопубликованных коммитов."}
  - {id: git-intro-005, type: choice, q: "Создал ветку `git branch fix`, но не переключился и сделал коммит. Что сдвинулось?", options: ["`fix`", "Старая ветка, на которой стоит HEAD", "Обе", "Ничего"], answer: 1, explain: "Для «создать и работать» — `git switch -c` (раньше `checkout -b`)."}
  - {id: git-intro-006, type: choice, q: "Что означает звёздочка `*` у ветки на схеме learngitbranching?", options: ["Ветка удалена", "Здесь стоит HEAD", "Ветка слита", "Ветка на GitHub"], answer: 1, explain: "После `checkout` звёздочка переходит на другую ветку."}
  - {id: git-intro-007, type: choice, q: "После `git merge bugFix` на `main` что с `bugFix`?", options: ["Удаляется", "Остаётся на месте, `main` указывает на коммит слияния", "Переезжает на main", "Сливается обратно"], answer: 1, explain: "Если потом на `bugFix` слить `main`, будет fast-forward."}
  - {id: git-intro-008, type: choice, q: "Почему у коммита слияния два родителя?", options: ["Так случайно получилось", "Он объединяет две линии истории: родители — последние коммиты обеих веток", "Один родитель — GitHub", "Два автора"], answer: 1, explain: "`git log --graph` рисует их сходящимися."}
  - {id: git-intro-009, type: choice, q: "Что делает rebase с исходными коммитами?", options: ["Двигает их", "Не двигает: создаёт копии (C2') поверх новой базы", "Удаляет", "Сливает в один"], answer: 1, explain: "Поэтому rebase переписывает историю."}
  - {id: git-intro-010, type: choice, q: "Что обычно делают после `rebase`, чтобы вернуть ветки вместе?", options: ["Ничего", "Merge, он проходит как fast-forward", "Удаляют обе", "Новый rebase"], answer: 1, explain: "История остаётся линейной."}
  - {id: git-intro-011, type: choice, q: "Какая команда эмулятора сбрасывает уровень?", options: ["undo", "reset", "hint", "levels"], answer: 1, explain: "`undo` отменяет последнюю команду, `show goal` показывает цель, `hint` — подсказка."}
  - {id: git-intro-012, type: choice, q: "Что такое ветка в Git одним предложением?", options: ["Копия проекта", "Лёгкий указатель на коммит", "Папка", "Сервер"], answer: 1, explain: "Поэтому ветки «рано и часто» — это дёшево."}
  - {id: git-intro-013, type: choice, q: "В каком случае rebase безопасен?", options: ["Для опубликованных коммитов", "Для своих неопубликованных коммитов", "Всегда", "Для чужих веток"], answer: 1, explain: "У merge такого ограничения нет."}
  - {id: git-intro-014, type: choice, q: "`git checkout -b имя` соответствует…", options: ["`git switch имя`", "`git switch -c имя`", "`git branch -d имя`", "`git merge имя`"], answer: 1, explain: "На сайте используется checkout, в реальном Git — switch."}
