topic: git-branches
title: Git — ветки и слияние
chapter: git
week: 1
source: 040-теория/git-ветки-pro-git-3.1-3.2.md
questions:
  - id: git-branches-001
    type: choice
    q: Почему создать ветку в Git — почти бесплатная операция?
    options:
      - Git копирует только изменённые файлы
      - Ветка — это лёгкий указатель на коммит (маленький файл с хэшем)
      - Git создаёт ветку лениво, при первом коммите
      - Ветки хранятся на сервере, а не локально
    answer: 1
    explain: Ветка — файл в .git/refs/heads/ с хэшем коммита (41 байт). Файлы проекта не копируются.
  - id: git-branches-002
    type: choice
    q: Чем `git branch fix` отличается от `git switch -c fix`?
    options:
      - Ничем, это одна и та же команда
      - branch создаёт указатель, но остаётся на старой ветке; switch -c ещё и переключает HEAD
      - branch удаляет ветку, switch -c создаёт
      - switch -c создаёт ветку на сервере
    answer: 1
    explain: После `git branch` следующий коммит сдвинет старую ветку, а новая останется на месте — классическая ошибка.
  - id: git-branches-003
    type: choice
    q: Когда при слиянии fast-forward невозможен?
    options:
      - Когда в ветке больше одного коммита
      - Когда истории разошлись — в обеих ветках есть коммиты, которых нет в другой
      - Когда ветка уже запушена
      - Когда есть незакоммиченные файлы
    answer: 1
    explain: Fast-forward возможен, только если текущая ветка — прямой предок сливаемой. Иначе нужно трёхстороннее слияние.
  - id: git-branches-004
    type: choice
    q: Сколько родителей у коммита слияния?
    options: ["0", "1", "2 (или больше)", "Ровно 3"]
    answer: 2
    explain: Он объединяет две линии истории, поэтому ссылается на последние коммиты обеих веток.
  - id: git-branches-005
    type: multi
    q: "Что нужно сделать, чтобы завершить разрешение конфликта слияния? (выбери все верные)"
    options:
      - Удалить маркеры <<<<<<<, ======= и >>>>>>> из файла
      - Выполнить `git add файл`
      - Выполнить `git commit`
      - Выполнить `git push --force`
    answer: [0, 1, 2]
    explain: Правишь файл и убираешь маркеры, `git add` сообщает «конфликт разрешён», `git commit` завершает слияние. Отменить всё можно через `git merge --abort`.
  - id: git-branches-006
    type: order
    q: Расставь шаги разрешения конфликта по порядку
    items:
      - Git сообщает CONFLICT, слияние на паузе
      - Открыть файл и выбрать нужный вариант
      - Удалить маркеры конфликта
      - git add файл
      - git commit
    explain: Сначала правка файла, потом add как сигнал Git, потом commit завершает слияние.
  - id: git-branches-007
    type: card
    q: Какие три снимка использует трёхстороннее слияние?
    answer: Конец текущей ветки, конец сливаемой ветки и их общий предок (где ветки разошлись). Результат — новый коммит слияния с двумя родителями.
  - {id: git-branches-008, type: choice, q: "Что хранит коммит?", options: ["Только изменения файлов", "Ссылку на корневой tree (снимок проекта), автора, дату, сообщение и родителя", "Только хэш", "Список веток"], answer: 1, explain: "Коммит хранит снимок, а не diff. Родителей: 0 у первого, 1 у обычного, 2 у слияния."}
  - {id: git-branches-009, type: choice, q: "Что такое HEAD?", options: ["Первый коммит", "Указатель на текущую ветку («я здесь»)", "Удалённый репозиторий", "Последний push"], answer: 1, explain: "Отсюда Git знает, какую ветку двигать при коммите. Посмотреть: `git log --oneline --decorate`."}
  - {id: git-branches-010, type: choice, q: "Что меняет `git switch`?", options: ["Только HEAD", "Только файлы в папке", "И HEAD, и файлы в папке (под снимок ветки)", "Только индекс"], answer: 2, explain: "Поэтому после switch изменения из другой ветки «пропадают» из папки, но остаются в её истории."}
  - {id: git-branches-011, type: choice, q: "Чем `git branch -d` отличается от `-D`?", options: ["Ничем", "-d удаляет только уже слитую ветку, -D принудительно (коммиты могут потеряться)", "-D безопаснее", "-d удаляет на GitHub"], answer: 1, explain: "`-d` — защита от потери работы."}
  - {id: git-branches-012, type: choice, q: "Что записано в файле ветки `.git/refs/heads/имя`?", options: ["Список файлов", "Хэш коммита (40 символов + перевод строки = 41 байт)", "История коммитов", "Адрес GitHub"], answer: 1, explain: "Создание ветки — запись одного крошечного файла, поэтому «почти бесплатно»."}
  - {id: git-branches-013, type: choice, q: "Что делает `git switch -`?", options: ["Создаёт ветку", "Возвращает на предыдущую ветку", "Удаляет ветку", "Сливает ветки"], answer: 1, explain: "Аналог `cd -` в терминале."}
  - {id: git-branches-014, type: choice, q: "Что делает `git merge --abort`?", options: ["Завершает слияние", "Отменяет слияние и возвращает состояние до него", "Удаляет ветку", "Отправляет на GitHub"], answer: 1, explain: "Если передумал сливать, пока идёт разрешение конфликта."}
  - {id: git-branches-015, type: choice, q: "Как конфликт выглядит в `git status`?", options: ["`Untracked files`", "Раздел `Unmerged paths`, у файла `both modified`", "`nothing to commit`", "`ahead of origin/main`"], answer: 1, explain: "Конфликт возникает при merge, а не при push. Ошибка push `rejected` — другое: на GitHub есть коммиты, которых нет у тебя."}
  - {id: git-branches-016, type: choice, q: "Создаёт ли fast-forward-слияние новый коммит?", options: ["Да, коммит слияния", "Нет, указатель ветки просто сдвигается вперёд", "Да, но пустой", "Только при конфликте"], answer: 1, explain: "В выводе merge стоит слово `Fast-forward`."}
